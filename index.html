<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics Dashboard Card with HTML &amp; CSS 📈 | Modern Data UI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="analytics-card">
  <div class="analytics-header">
    <div>
      <p class="eyebrow">OVERVIEW</p>
      <h1>Website Analytics</h1>
    </div>

    <button class="period-button" type="button">
      This Month ⌄
    </button>
  </div>

  <div class="metric-row">
    <div>
      <span class="metric-label">Total Visitors</span>
      <strong class="metric-value">48,294</strong>
    </div>

    <div class="growth-badge">↗ 18.6%</div>
  </div>

  <div class="chart-area">
    <div class="chart-y-axis">
      <span>50k</span>
      <span>40k</span>
      <span>30k</span>
      <span>20k</span>
      <span>10k</span>
      <span>0</span>
    </div>

    <div class="chart">
      <div class="chart-grid">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="bars">
        <div class="bar-column">
          <span class="bar" style="height: 42%"></span>
          <small>Mon</small>
        </div>

        <div class="bar-column">
          <span class="bar" style="height: 58%"></span>
          <small>Tue</small>
        </div>

        <div class="bar-column">
          <span class="bar" style="height: 47%"></span>
          <small>Wed</small>
        </div>

        <div class="bar-column">
          <span class="bar" style="height: 74%"></span>
          <small>Thu</small>
        </div>

        <div class="bar-column">
          <span class="bar" style="height: 65%"></span>
          <small>Fri</small>
        </div>

        <div class="bar-column">
          <span class="bar active" style="height: 88%"></span>
          <small>Sat</small>
        </div>

        <div class="bar-column">
          <span class="bar" style="height: 69%"></span>
          <small>Sun</small>
        </div>
      </div>
    </div>
  </div>

  <div class="analytics-footer">
    <div class="legend">
      <span class="legend-dot"></span>
      <span>Visitors</span>
    </div>

    <span class="comparison">Compared with last month</span>
  </div>
</div>
</body>
</html>
